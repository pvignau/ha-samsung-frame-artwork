name: Validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both validators keep evolving: a weekly run surfaces breakage without
    # waiting for the next commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # The "brands" check requires the domain to be registered in the
          # home-assistant/brands repository, which only applies to
          # integrations shipped in the HACS default catalogue. It fails on
          # every custom integration.
          ignore: brands
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyflakes
      - name: Undefined names and unused imports
        run: pyflakes custom_components/samsung_frame/*.py custom_components/samsung_frame/sources/*.py
      - name: Manifest key order and requirement format
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path("custom_components/samsung_frame/manifest.json").read_text())
          keys = list(d)
          expected = ["domain", "name"] + sorted(k for k in d if k not in ("domain", "name"))
          problems = []
          if keys != expected:
              problems.append(f"manifest keys must be {expected}, got {keys}")
          # hassfest rejects a PEP 508 direct reference written with spaces
          for req in d["requirements"]:
              if " " in req:
                  problems.append(f"requirement contains a space: {req}")
          print("\n".join(problems) or "manifest OK")
          sys.exit(1 if problems else 0)
          PY

      - name: Valid JSON and aligned translations
        run: |
          python - <<'PY'
          import json, pathlib, sys
          def flat(d, p=""):
              out = {}
              for k, v in d.items():
                  q = f"{p}.{k}" if p else k
                  out.update(flat(v, q)) if isinstance(v, dict) else out.update({q: v})
              return out
          base = pathlib.Path("custom_components/samsung_frame")
          files = {n: json.loads((base / n).read_text())
                   for n in ("strings.json", "translations/en.json", "translations/fr.json")}
          problems = []
          if files["strings.json"] != files["translations/en.json"]:
              problems.append("translations/en.json must be a copy of strings.json")
          keys = {n: set(flat(d)) for n, d in files.items()}
          for n in ("translations/fr.json",):
              missing = keys["strings.json"] - keys[n]
              extra = keys[n] - keys["strings.json"]
              if missing: problems.append(f"{n}: missing keys {sorted(missing)}")
              if extra: problems.append(f"{n}: unexpected keys {sorted(extra)}")
          # A literal angle bracket breaks the frontend ICU parser (UNCLOSED_TAG),
          # and hassfest rejects translation strings that contain a URL.
          import re
          for n, d in files.items():
              for k, v in flat(d).items():
                  if not isinstance(v, str):
                      continue
                  if "<" in v or ">" in v:
                      problems.append(f"{n}:{k} contains an angle bracket")
                  if v.count("{") != v.count("}"):
                      problems.append(f"{n}:{k} has unbalanced braces")
                  if re.search(r"https?://", v, re.I):
                      problems.append(f"{n}:{k} contains a URL")
          print("\n".join(problems) or "translations OK")
          sys.exit(1 if problems else 0)
          PY
